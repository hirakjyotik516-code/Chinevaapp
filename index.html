<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChinevaChat</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- Login / User Entry Screen -->
        <div id="login-screen" class="screen active">
            <div class="login-card">
                <i class="fa-brands fa-whatsapp logo-icon"></i>
                <h2>ChinevaChat</h2>
                <p>Apna naam daal kar room join karein</p>
                <input type="text" id="username-input" placeholder="Aapka Naam (Your Name)">
                <input type="text" id="room-input" placeholder="Room ID (e.g. chat123)" value="main-room">
                <button id="start-chat-btn">Start Chatting</button>
            </div>
        </div>

        <!-- Chat Main Screen -->
        <div id="chat-screen" class="screen">
            <header class="chat-header">
                <div class="user-header-info">
                    <img src="https://ui-avatars.com/api/?background=0D8ABC&color=fff&name=User" id="chat-avatar" class="avatar" alt="Avatar">
                    <div class="chat-user-details">
                        <h3 id="room-display-name">Room: main-room</h3>
                        <span id="my-display-name">Online</span>
                    </div>
                </div>
                <div class="chat-header-icons">
                    <i class="fa-solid fa-video"></i>
                    <i class="fa-solid fa-phone"></i>
                    <i class="fa-solid fa-right-from-bracket" id="logout-btn" title="Logout"></i>
                </div>
            </header>

            <div class="chat-body" id="chat-body">
                <!-- Live Messages Output -->
            </div>

            <footer class="chat-footer">
                <div class="input-container">
                    <i class="fa-regular fa-face-smile"></i>
                    <input type="text" id="message-input" placeholder="Message...">
                </div>
                <button class="send-btn" id="send-btn">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </footer>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
